	<style>
		/* --- CSS KHUSUS STORE --- */
		
		.store-title {
			font-size: 2.5rem;
			font-weight: 700;
			color: #ffffff;
			margin: 20px 0 30px 0;
			text-align: center;
			text-shadow: 0 2px 10px rgba(0,0,0,0.5);
		}

		.store-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 27px;
			max-width: 1100px;
			width: 100%;
			margin: 0 auto 50px auto;
		}

		.store-item {
			background: rgba(0, 0, 0, 0.55);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 16px;
			padding: 30px 20px;
			text-align: center;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
		}

		.store-item:hover {
			transform: scale(1.05);
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
			border-color: rgba(255, 255, 255, 0.3);
			background: rgba(0, 0, 0, 0.7);
		}

		.item-name {
			font-size: 1.4rem;
			font-weight: 600;
			color: #ffffff;
			margin-bottom: 15px;
		}

		.item-image {
			width: 140px;
			height: 140px;
			object-fit: contain;
			margin-bottom: 15px;
		}

		.item-price {
			font-size: 1.35rem;
			font-weight: 700;
			color: #ffffff;
			margin-bottom: 20px;
		}

		.item-buttons {
			display: flex;
			gap: 12px;
			width: 100%;
			justify-content: center;
		}

		.btn-info {
			background-color: #ffffff !important;
			color: #000000 !important;
			border: none;
			width: 45px;
			height: 44px;
			border-radius: 10px;
			font-weight: bold;
			font-size: 1.1rem;
			cursor: pointer;
			transition: background-color 0.2s;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.btn-beli {
			background-color: #ffffff !important;
			color: #000000 !important;
			border: none;
			padding: 0 25px;
			height: 44px;
			border-radius: 10px;
			font-weight: bold;
			font-size: 1.05rem;
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: background-color 0.2s;
			flex-grow: 1;
			max-width: 130px;
		}

		.btn-info:hover, .btn-beli:hover {
			background-color: #e0e0e0 !important;
		}

		/* POP-UP MODAL */
		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(0, 0, 0, 0.7);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 99999;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}

		.modal-overlay.active {
			opacity: 1;
			pointer-events: auto;
		}

		.modal-content {
			background: rgba(255, 115, 115, 0.85);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid rgba(255, 255, 255, 0.4);
			border-radius: 16px;
			padding: 25px 30px;
			width: 90%;
			max-width: 420px;
			color: #ffffff;
			position: relative;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
			transform: scale(0.85);
			transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			text-align: left;
		}

		.modal-overlay.active .modal-content {
			transform: scale(1);
		}

		.modal-header {
			display: flex;
			justify-content: center;
			align-items: center;
			margin-bottom: 20px;
			position: relative;
		}

		.modal-header h2 {
			font-size: 1.8rem;
			font-weight: 700;
			color: #ffffff;
			margin: 0;
		}

		.close-btn {
			position: absolute;
			right: 0;
			top: -5px;
			background: none;
			border: none;
			color: white;
			font-size: 1.5rem;
			font-weight: bold;
			cursor: pointer;
		}

		.benefit-list {
			list-style: none;
			font-size: 0.95rem;
			line-height: 1.7;
			font-weight: 600;
			padding: 0;
			margin: 0;
		}

		.benefit-list li {
			position: relative;
			padding-left: 20px;
			color: #ffffff;
		}

		.benefit-list li::before {
			content: "•";
			position: absolute;
			left: 0;
			color: white;
			font-size: 1.2rem;
		}

		@media (max-width: 768px) {
			.store-grid { grid-template-columns: repeat(2, 1fr); }
		}
		@media (max-width: 480px) {
			.store-grid { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<div id="tsparticles"></div>

	<!-- POP-UP MODAL GLASS MERAH TRANSPARAN -->
	<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="modalTitle">Detail</h2>
				<button class="close-btn" onclick="closeModal()">X</button>
			</div>
			<ul class="benefit-list" id="benefitList">
				<!-- Benefit akan diisi oleh JavaScript secara otomatis -->
			</ul>
		</div>
	</div>

	<script>
		// DATA BENEFIT MASING-MASING RANK (Ubah daftar benefit di sini)
		const rankData = {
			gakusei: {
				title: "Detail Gakusei",
				benefits: [
					"Prefix [Gakusei] Khusus",
					"Uang In-Game $10,000",
					"Kit Starter Gakusei",
					"Akses Role Gakusei di Discord"
				]
			},
			roudousha: {
				title: "Detail Roudousha",
				benefits: [
					"Prefix [Roudousha] Khusus",
					"Uang In-Game $25,000",
					"Kit Roudousha",
					"Bisa Set Home (3 Location)",
					"Akses Role Roudousha di Discord"
				]
			},
			kaitakusha: {
				title: "Detail Kaitakusha",
				benefits: [
					"Prefix [Kaitakusha] Khusus",
					"Uang In-Game $50,000",
					"Kit Kaitakusha VIP",
					"Akses Fly di Hub/Lobby",
					"Bisa Set Home (5 Location)",
					"Akses Role Premium di Discord"
				]
			},
			jitsugyouka: {
				title: "Detail Jitsugyouka",
				benefits: [
					"Prefix [Jitsugyouka] Khusus",
					"Uang In-Game $100,000",
					"Kit Jitsugyouka Pro",
					"Akses Fly di Claim Land",
					"Prioritas Slot Masuk Server",
					"Akses Role Premium di Discord"
				]
			},
			torishimariyaku: {
				title: "Detail Torishimariyaku",
				benefits: [
					"Prefix [Torishimariyaku] Khusus",
					"Uang In-Game $250,000",
					"Kit Torishimariyaku Ultimate",
					"Akses Command /hat & /workbench",
					"Bisa Set Home Unlimted",
					"Akses VIP Channel di Discord"
				]
			},
			custom: {
				title: "Detail Custom Rank",
				benefits: [
					"Request Prefix + Warna Custom Bebas",
					"Uang In-Game $500,000",
					"Semua Akses Benefit Rank Sebelumnya",
					"Akses Tag Khusus di Discord",
					"Support Langsung dari Owner"
				]
			}
		};

		function openModal(rankKey) {
			const data = rankData[rankKey];
			if (!data) return;

			// Ubah Judul Modal
			document.getElementById('modalTitle').innerText = data.title;

			// Ubah List Benefit
			const benefitListElement = document.getElementById('benefitList');
			benefitListElement.innerHTML = ''; // Kosongkan list lama

			data.benefits.forEach(benefit => {
				const li = document.createElement('li');
				li.textContent = benefit;
				benefitListElement.appendChild(li);
			});

			// Tampilkan Modal
			document.getElementById('modalOverlay').classList.add('active');
		}

		function closeModal() {
			document.getElementById('modalOverlay').classList.remove('active');
		}

		function closeModalOnBg(event) {
			if (event.target.id === 'modalOverlay') {
				closeModal();
			}
		}
	</script>

	<script src="js/firefly.js" type="text/javascript"></script>
	<script src="js/main.js" type="text/javascript"></script>
