    ];

    function dpShow(index) {
      const list = document.getElementById("dpBenefits");
      list.innerHTML = "";

      dpProducts[index].benefits.forEach(function(text) {
        const li = document.createElement("li");
        li.textContent = text;
        list.appendChild(li);
      });

      document.getElementById("dpModal").classList.add("dp-open");
    }

    function dpClose() {
      document.getElementById("dpModal").classList.remove("dp-open");
    }

    function dpOutside(event) {
      if (event.target.id === "dpModal") dpClose();
    }

    function dpBuy(index) {
      window.location.href = dpProducts[index].buy;
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") dpClose();
    });
